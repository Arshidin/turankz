# Netlify configuration for Turan Standard Pool Documentation

[build]
  command = "npm run docs:build"
  publish = "docs-site/.vitepress/dist"

[build.environment]
  NODE_VERSION = "18"

# Redirect rules for /docs base path
[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

# SPA fallback for client-side routing (VitePress handles routing)
# Note: VitePress uses base path /docs/, so all routes are relative to that

# Headers for caching
[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

